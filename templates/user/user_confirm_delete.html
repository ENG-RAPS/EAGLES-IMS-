{% extends 'partials/base.html' %}
{% load static %}

{% block title %}Delete User{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0"><i class="fas fa-trash"></i> Confirm Delete</h4>
                </div>
                <div class="card-body">
                    <p>Are you sure you want to permanently delete <strong>{{ user.username }}</strong>?</p>
                    <p class="text-muted">This action cannot be undone.</p>
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">Delete User</button>
                        <a href="{% url 'user:list' %}" class="btn btn-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
